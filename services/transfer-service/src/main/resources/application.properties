spring.application.name=transfer-service

server.port=8085
spring.output.ansi.enabled=always

spring.datasource.url=${DB_ACCOUNT_SERVICE_URL}
spring.datasource.username=${DB_ACCOUNT_SERVICE_USERNAME}
spring.datasource.password=${DB_ACCOUNT_SERVICE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
logging.level.org.springframework.security=DEBUG

spring.cloud.openfeign.httpclient.hc5.enabled=true

secret-key=${SECRET_KEY}

clients.account-service.url=${ACCOUNT_SERVICE_URL}
clients.balance-service.url=${BALANCE_SERVICE_URL}
clients.transaction-service.url=${TRANSACTION_SERVICE_URL}
clients.idempotency-service.url=${IDEMPOTENCY_SERVICE_URL}
clients.currency-service.url=${CURRENCY_SERVICE_URL}