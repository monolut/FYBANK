spring.application.name=user-service

server.port=8082
spring.output.ansi.enabled=always

spring.datasource.url=${DB_USER_SERVICE_URL}
spring.datasource.username=${DB_USER_SERVICE_USERNAME}
spring.datasource.password=${DB_USER_SERVICE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
logging.level.org.springframework.security=DEBUG

secret-key=${SECRET_KEY}

clients.account-service.url=${ACCOUNT_SERVICE_URL}
clients.auth-service.url=${AUTH_SERVICE_URL}
clients.balance-service.url=${BALANCE_SERVICE_URL}