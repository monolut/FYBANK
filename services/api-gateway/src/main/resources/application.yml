server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:

        - id: auth-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/auth/**

        - id: user-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/user/**
          filters:
            - JwtAuthentication

        - id: account-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/account/**
          filters:
            - JwtAuthentication

        - id: balance-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/balance/**
          filters:
            - JwtAuthentication

        - id: transfer-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/transfer/**
          filters:
            - JwtAuthentication

        - id: transaction-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/transaction/**

        - id: currency-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/crrency/**

